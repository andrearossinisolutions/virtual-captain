<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in - Virtual Captain</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<p class="brand">Virtual Captain</p>
<div class="card">
<h1>Sign in</h1>
<form id="form" method="post" novalidate>
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>

<button type="submit">Sign in</button>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</form>
<p class="hint">Did not confirm your address in time? If the link expired, register again with the same address.</p>
<p class="links"><a href="/register">Create account</a><a href="/forgot">Forgot password</a></p>
</div>
<noscript><p class="msg error">This page needs JavaScript.</p></noscript>
</main>
<script src="/common.js"></script>
<script src="/login.js"></script>
</body>
</html>
