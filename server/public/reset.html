<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reset password - Virtual Captain</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<p class="brand">Virtual Captain</p>
<div class="card">
<h1>Choose a new password</h1>
<form id="form" method="post" novalidate>
<label for="password">New password</label>
<input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required>
<p class="hint">At least 10 characters.</p>
<label for="confirm">Repeat the password</label>
<input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required>

<button type="submit">Set password</button>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</form>
<p class="links"><a href="/forgot">Request a new link</a></p>
</div>
<noscript><p class="msg error">This page needs JavaScript.</p></noscript>
</main>
<script src="/common.js"></script>
<script src="/reset.js"></script>
</body>
</html>
